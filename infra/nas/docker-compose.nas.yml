# =============================================================================
# Light Keepers - NAS 生產棧（INF-1 / 工作項 M.1）
#
# 目標硬體：ASUSTOR AS5404T（Celeron N5105 4C4T / 16GB DDR4 / ADM 5.1.1）
#   - 4× M.2 NVMe RAID 10 → DB 與 uploads（熱資料，高 IOPS）
#   - 4× 3.5" HDD RAID 6  → 每日 pg_dump 與 uploads 快照（冷資料）
#   - 2× 2.5GbE           → 內網連 GPU 工作站（RTX 4080 SUPER 16GB，Ollama 推論）
#
# 設計原則（回雲四原則，見 README §4）：
#   1) 運行單位是 Docker image  2) 組態全部走 env
#   3) schema 走 migration      4) storage / LLM 走 provider 抽象
#   任何一項被打破，未來回雲就得改業務碼。
#
# 啟動：
#   cd infra/nas
#   cp .env.nas.example .env && chmod 600 .env && vi .env
#   docker compose -f docker-compose.nas.yml --env-file .env up -d
#
# ⚠ 本檔不含任何秘密；所有機敏值一律從 .env 注入。
# ⚠ AI 推論「不」在此棧內：LLM_BASE_URL 指向內網 GPU 工作站。
#
# 記憶體規劃（實體 16GB，預留 ~4GB 給 ADM 本身與檔案系統快取）：
#   postgres 4G / backend 2G / nginx 256M / cloudflared 256M / backup 512M
#   合計上限約 7GB，尖峰仍有餘裕。
# =============================================================================

name: lightkeepers-nas

# --- 共用片段 -----------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-restart: &default-restart
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL + PostGIS —— 資料落在 NVMe RAID 10
  # ---------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: lk-postgres
    <<: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required}
      # 明確指定，避免 initdb 沿用主機 locale 造成排序行為與雲端不一致
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      # NVMe RAID 10：DB 資料本體
      - ${NVME_DATA_ROOT:?NVME_DATA_ROOT is required}/pgdata:/var/lib/postgresql/data
      # 初始化 SQL（僅在 pgdata 為空時執行一次）
      - ../docker/init-db:/docker-entrypoint-initdb.d:ro
    # 不對外 publish：只有同 network 的 backend / backup 需要連。
    # 需用 pgAdmin 或 psql 除錯時，改用 `docker compose exec postgres psql`，
    # 或臨時加 ports 綁 127.0.0.1，切勿綁 0.0.0.0。
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    # A4 共存：AS5404T 16GB 與 ST 棧（13 容器+openclaw 五件套）分食——預設保守 2g，
    # 部署前 docker stats 實測餘裕後可調（.env 設 LK_PG_MEM）
    mem_limit: ${LK_PG_MEM:-2g}
    mem_reservation: 1g
    shm_size: 512m
    stop_grace_period: 60s
    networks: [lk-internal]

  # ---------------------------------------------------------------------------
  # NestJS 後端 —— 沿用 backend/Dockerfile（production stage）
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-lightkeepers/backend:local}
    container_name: lk-backend
    <<: *default-restart
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: 8080
      API_PREFIX: api/v1
      TZ: ${TZ:-Asia/Taipei}

      # --- 資料庫（backend 只讀 DB_* 系列，src 內無 DATABASE_URL 讀取點）---
      DB_REQUIRED: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      # 生產環境 schema 一律走 migration；resolveSynchronize() 也會硬性擋掉
      SYNC_TABLES: "false"

      # --- 秘密 ---
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_OFFLINE_SECRET: ${JWT_OFFLINE_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-lightkeepers}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-lightkeepers-app}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}

      # --- 對外 URL / CORS ---
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      BASE_URL: ${BASE_URL:-https://${PUBLIC_DOMAIN}}
      FRONTEND_URL: ${FRONTEND_URL:-https://${PUBLIC_DOMAIN}}
      API_URL: ${BASE_URL:-https://${PUBLIC_DOMAIN}}

      # --- 檔案儲存：NAS 上切 local driver（回雲時改回 gcs 即可）---
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/uploads}
      LOCAL_STORAGE_URL: ${LOCAL_STORAGE_URL:-https://${PUBLIC_DOMAIN}/uploads}
      # 選填：設定後簽名 URL 會帶 expires+signature（nginx 出檔行為不變）
      LOCAL_STORAGE_SIGNING_SECRET: ${LOCAL_STORAGE_SIGNING_SECRET:-}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      EXPORT_DIR: /app/uploads/exports
      BACKUP_DIR: /app/uploads/exports

      # --- 本地 LLM：內網 GPU 工作站的 OpenAI-compatible endpoint ---
      # LLM_PROVIDER=hybrid（D27 拍板）：平時全走本地；工作站不可用時降級 Gemini。
      # 預設不能是 gemini——那會讓 NAS 上所有 LLM 流量 100% 打雲端。
      LLM_PROVIDER: ${LLM_PROVIDER:-hybrid}
      LLM_BASE_URL: ${LLM_BASE_URL:?LLM_BASE_URL is required - point to workstation Ollama}
      # D22 實機對測定案：qwen2.5:7b-instruct（95% 準確／6.4s／VRAM 4.7GB）
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      # --- 外部服務（不受 GCP 租約影響）---
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_CLIENT_ID: ${LINE_CLIENT_ID:-}
      LINE_CLIENT_SECRET: ${LINE_CLIENT_SECRET:-}
      LINE_REDIRECT_URI: ${LINE_REDIRECT_URI:-}
      LIFF_ID: ${LIFF_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      CWA_API_KEY: ${CWA_API_KEY:-}
      WRA_API_KEY: ${WRA_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      # NVMe RAID 10：使用者上傳（local storage driver 的 basePath）
      - ${NVME_DATA_ROOT:?NVME_DATA_ROOT is required}/uploads:/app/uploads
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 用 /health/live（不碰 DB），避免 DB 短暫抖動就把 app 判成不健康
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/api/v1/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    mem_limit: ${LK_BACKEND_MEM:-2g}
    mem_reservation: 512m
    stop_grace_period: 30s
    networks: [lk-internal]

  # ---------------------------------------------------------------------------
  # nginx —— 前端靜態檔 + /api 反代 + /uploads 直出
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: lk-nginx
    <<: *default-restart
    logging: *default-logging
    environment:
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端 build 產物（web-dashboard/dist）
      - ${WEB_DIST_PATH:?WEB_DIST_PATH is required}:/usr/share/nginx/html:ro
      # uploads 直接由 nginx 出檔，不經 Node.js（backend 沒有 static 路由）
      - ${NVME_DATA_ROOT:?NVME_DATA_ROOT is required}/uploads:/usr/share/nginx/uploads:ro
    ports:
      # 內網直連用；對外流量走 cloudflared，不需要在路由器開 port
      - "${NGINX_HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    networks: [lk-internal]

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel —— 對外入口，免在中華電信固定 IP 上開 port
  #
  # 路由設定在 Cloudflare Zero Trust 主控台（token 模式為主控台管理）：
  #   Public hostname: ${PUBLIC_DOMAIN}  →  Service: http://nginx:8080
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    container_name: lk-cloudflared
    <<: *default-restart
    logging: *default-logging
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
      TZ: ${TZ:-Asia/Taipei}
    depends_on:
      nginx:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "cloudflared --version || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 256m
    networks: [lk-internal]

  # ---------------------------------------------------------------------------
  # 備份 job —— 每日 pg_dump + uploads rsync → HDD RAID 6，保留 14 天
  #                並推送第二副本到 NAS 以外的目標（CD-6 / 工作項 C1.3）
  #
  # 沒有用 host crond：ADM 的排程與容器生命週期分離，容器一停排程就變孤兒。
  # 改用容器內常駐迴圈（entrypoint.sh），與棧同生共死，狀態也看得到。
  #
  # 雙目標：HDD 池是「主副本」（快、隨時可還原），Mac mini／雲端冷儲存是
  # 「第二副本」（離開這台機器，扛得住整台 NAS 消失）。兩者缺一都不算備份完成。
  # ---------------------------------------------------------------------------
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: lightkeepers/backup:local
    container_name: lk-backup
    <<: *default-restart
    logging: *default-logging
    environment:
      TZ: ${TZ:-Asia/Taipei}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${DB_USERNAME:?DB_USERNAME is required}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGDATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      BACKUP_AT: ${BACKUP_AT:-03:30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}

      # --- 第二副本（CD-6）：預設關閉，設定完目標後才打開 ---
      # ⚠ REPLICA_ENABLED=false 時 backup.sh 會在日誌留下 WARN：
      #   同址單一副本不符合 CD-6，僅供尚未備妥第二目標的過渡期使用。
      REPLICA_ENABLED: ${REPLICA_ENABLED:-false}
      REPLICA_MODE: ${REPLICA_MODE:-rsync}
      # 預設與主副本同為 14 天。第二副本若空間允許建議拉到 30 天以上：
      # 勒索軟體常有超過兩週的潛伏期，保留期短於潛伏期＝乾淨備份已被輪替掉。
      # （compose 的變數展開不支援巢狀預設值，故此處寫死 14 而非引用 BACKUP_RETENTION_DAYS）
      REPLICA_RETENTION_DAYS: ${REPLICA_RETENTION_DAYS:-14}
      REPLICA_VERIFY_UPLOADS: ${REPLICA_VERIFY_UPLOADS:-true}
      # 方案 A：rsync over SSH → Mac mini
      REPLICA_SSH_HOST: ${REPLICA_SSH_HOST:-}
      REPLICA_SSH_USER: ${REPLICA_SSH_USER:-}
      REPLICA_SSH_PORT: ${REPLICA_SSH_PORT:-22}
      REPLICA_REMOTE_ROOT: ${REPLICA_REMOTE_ROOT:-}
      # 容器內固定路徑；host 端的實際檔案由下方 volumes 的 *_HOST 變數指定
      REPLICA_SSH_KEY: /secrets/replica_key
      # 方案 B：rclone crypt → S3 相容冷儲存
      RCLONE_CONFIG: /secrets/rclone.conf
      REPLICA_RCLONE_REMOTE: ${REPLICA_RCLONE_REMOTE:-}
      REPLICA_RCLONE_VERIFY: ${REPLICA_RCLONE_VERIFY:-download}
      # healthcheck 門檻（秒）：本地 26h、第二副本 49h（兩個週期 + 1h 容差）
      BACKUP_STALE_SECONDS: ${BACKUP_STALE_SECONDS:-93600}
      REPLICA_STALE_SECONDS: ${REPLICA_STALE_SECONDS:-176400}
    volumes:
      # 來源：NVMe 上的 uploads（唯讀，備份程序不該有寫權限）
      - ${NVME_DATA_ROOT:?NVME_DATA_ROOT is required}/uploads:/source/uploads:ro
      # 目的：HDD RAID 6 備份池
      - ${HDD_BACKUP_ROOT:?HDD_BACKUP_ROOT is required}:/backup
      # 第二副本的憑證，唯讀掛入。未啟用時指向 repo 內的佔位／範本檔——
      # compose 不支援條件式 mount，來源路徑不存在會讓整個服務起不來。
      - ${REPLICA_SSH_KEY_HOST:-./backup/replica-key.placeholder}:/secrets/replica_key:ro
      - ${REPLICA_RCLONE_CONF_HOST:-./backup/rclone.conf.example}:/secrets/rclone.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 兩條心跳：本地備份 + 第二副本。判定邏輯與失敗原因見 backup/healthcheck.sh
      # （原本是寫死在這裡的一行 CMD-SHELL，加入第二副本後條件變多，抽成腳本才讀得懂也測得動）
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 300s
      timeout: 30s
      retries: 3
      start_period: 120s
    mem_limit: 512m
    networks: [lk-internal]

networks:
  lk-internal:
    name: lightkeepers-nas
    driver: bridge
