# =============================================================================
# Light Keepers - NAS nginx 設定（INF-1 / 工作項 M.1）
#
# 角色：
#   /            → web-dashboard 靜態檔（SPA，fallback 到 index.html）
#   /api/        → 反代到 backend:8080（NestJS，global prefix = api/v1）
#   /uploads/    → 直接出檔 local storage driver 的檔案（不經 Node.js）
#   /healthz     → nginx 自身健康檢查
#
# TLS 由 Cloudflare Tunnel 終結，故此處只聽 HTTP；nginx 不需要憑證。
# =============================================================================

# 反代目標抽成 upstream：backend 重啟時 nginx 不會因為 DNS 解析失敗而整個掛掉
upstream lk_backend {
    server backend:8080 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare Tunnel 已終結 TLS，真實 client IP 在 CF-Connecting-IP
    real_ip_header CF-Connecting-IP;

    # 上傳大小上限（現場照片可能較大；backend 端另有 10MB 檢查）
    client_max_body_size 32m;

    # --- 安全標頭（TLS 由 Cloudflare 負責，HSTS 也在 CF 端設定較妥）---
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header Referrer-Policy           "same-origin"      always;
    add_header Permissions-Policy        "geolocation=(self), microphone=(), camera=(self)" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               image/svg+xml;

    # -------------------------------------------------------------------------
    # nginx 自身健康檢查（不轉發，確保 backend 掛掉時仍能區分是誰的問題）
    # -------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # -------------------------------------------------------------------------
    # API 反代
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://lk_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # LINE webhook / FCM callback 需要能撐住偶發慢請求
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # SSE / 長輪詢不做緩衝，否則事件會被卡在 nginx buffer
        proxy_buffering off;
    }

    # -------------------------------------------------------------------------
    # WebSocket（既有 websocket 事件通道）
    # -------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://lk_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
    }

    # -------------------------------------------------------------------------
    # 使用者上傳檔案
    #
    # 對應 backend 的 LOCAL_STORAGE_URL=https://<domain>/uploads
    # ⚠ 目前為公開讀取（等同 GCS 上的 public object 行為）。若日後要做授權出檔，
    #   改成 auth_request → backend 的簽章驗證端點，而不是把 alias 拿掉。
    # -------------------------------------------------------------------------
    location /uploads/ {
        alias /usr/share/nginx/uploads/;

        # 上傳目錄裡不該有可執行內容；一律當附件下載，避免儲存型 XSS
        add_header Content-Disposition "inline" always;
        add_header X-Content-Type-Options "nosniff" always;

        # local driver 會寫 <file>.meta.json sidecar，不可對外
        location ~ \.meta\.json$ {
            deny all;
        }

        expires 7d;
        add_header Cache-Control "private, max-age=604800";
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # 前端靜態資源
    # -------------------------------------------------------------------------
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不快取，否則改版後使用者拿到舊的 asset hash
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
