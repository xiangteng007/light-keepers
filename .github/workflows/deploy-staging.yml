name: Deploy to Staging

# ⚠ DEPRECATED（S5.9，2026-08-04）：GCP staging 部署已停用，僅保留作回雲參考。
# staging 已定調為開發機 compose（D33），不再部署到 Cloud Run。
# 原 push develop 自動觸發已移除；僅保留 workflow_dispatch。
on:
  workflow_dispatch:

env:
  PROJECT_ID: light-keepers-mvp
  REGION: asia-east1
  API_SERVICE: light-keepers-api-staging
  ENVIRONMENT: staging

jobs:
  deploy-api-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy API to Cloud Run (Staging)
        run: |
          REVISION_SUFFIX=$(echo "${{ github.sha }}" | cut -c1-8)-$(date +%H%M%S)

          gcloud run deploy ${{ env.API_SERVICE }} \
            --source ./backend \
            --region ${{ env.REGION }} \
            --platform managed \
            --revision-suffix=${REVISION_SUFFIX} \
            --add-cloudsql-instances=${{ env.PROJECT_ID }}:asia-east1:light-keepers-db \
            --set-env-vars="NODE_ENV=staging,DB_HOST=/cloudsql/${{ env.PROJECT_ID }}:asia-east1:light-keepers-db,DB_USERNAME=postgres,DB_DATABASE=lightkeepers_staging,CLOUD_SQL_CONNECTION_NAME=${{ env.PROJECT_ID }}:asia-east1:light-keepers-db,LINE_CLIENT_ID=2008769727,RESEND_FROM=noreply@lightkeepers.ngo,GIT_COMMIT=${{ github.sha }},SYNC_TABLES=true" \
            --set-secrets="DB_PASSWORD=db-password:latest,JWT_SECRET=jwt-secret:latest,LINE_CLIENT_SECRET=line-client-secret:latest,LINE_CHANNEL_ACCESS_TOKEN=line-channel-access-token:latest,LINE_CHANNEL_SECRET=line-channel-secret:latest,GOOGLE_CLIENT_ID=google-client-id:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,RESEND_API_KEY=resend-api-key:latest" \
            --timeout=300 \
            --memory=512Mi \
            --min-instances=0 \
            --max-instances=2 \
            --concurrency=40 \
            --port=8080 \
            --execution-environment=gen2 \
            --cpu-throttling \
            --startup-probe=httpGet.path=/api/v1/health/live,timeoutSeconds=30,periodSeconds=60,failureThreshold=10 \
            --quiet

      - name: Staging API URL
        run: |
          URL=$(gcloud run services describe ${{ env.API_SERVICE }} --region=${{ env.REGION }} --format='value(status.url)')
          echo "🚀 Staging API: $URL"
          echo "STAGING_API_URL=$URL" >> $GITHUB_ENV

  deploy-dashboard-staging:
    runs-on: ubuntu-latest
    needs: deploy-api-staging
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: web-dashboard
        run: npm ci

      - name: Build (Staging)
        working-directory: web-dashboard
        env:
          # Staging API points to staging Cloud Run service
          VITE_API_URL: ${{ vars.STAGING_API_URL || 'https://light-keepers-api-staging-955234851806.asia-east1.run.app' }}
          VITE_LINE_CLIENT_ID: "2008769727"
          VITE_LIFF_ID: ${{ secrets.LIFF_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: lightkeepers.ngo
          VITE_FIREBASE_PROJECT_ID: light-keepers-mvp
          VITE_FIREBASE_STORAGE_BUCKET: light-keepers-mvp.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "955234851806"
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: npm run build

      - name: Deploy to Firebase Hosting (Preview Channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIGHT_KEEPERS_MVP }}
          channelId: staging
          projectId: light-keepers-mvp
          entryPoint: web-dashboard
          expires: 30d
