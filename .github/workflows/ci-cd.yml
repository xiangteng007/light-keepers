name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Frontend 建置與測試
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 安全稽核（阻擋式，critical 級）
      # E.6 已將兩包 critical 清零（見 docs/security/DEPENDENCY_AUDIT_2026-07-31.md），
      # 因此 critical 級可安全設為阻擋。high 級仍有傳遞依賴殘餘（需 breaking 升版），
      # 待該文件列出的升版完成後再收緊為 --audit-level=high。
      - name: Security audit (blocking, critical)
        run: npm audit --audit-level=critical

      # Lint 閘門（棘輪式阻擋）
      # 現況：main 上已累積 229 個 eslint error（多為 react-refresh/only-export-components、
      # no-unused-vars、ban-ts-comment），直接改成阻擋式同樣會凍結所有發布。
      # 折衷：error 數量只能「持平或下降」，任何新增的 error 一律擋下 CI。
      # TODO(Phase F): 把既有 error 逐步清到 0，之後改成 `npm run lint -- --max-warnings=0`。
      - name: Lint check (error 數不得超過基準線)
        env:
          LINT_ERROR_BASELINE: 229
        run: |
          npx eslint . --format json --output-file eslint-report.json || true
          ERRORS=$(node -p "require('./eslint-report.json').reduce((a, f) => a + f.errorCount, 0)")
          WARNINGS=$(node -p "require('./eslint-report.json').reduce((a, f) => a + f.warningCount, 0)")
          echo "ESLint: ${ERRORS} errors / ${WARNINGS} warnings (baseline: ${LINT_ERROR_BASELINE})"
          if [ "$ERRORS" -gt "$LINT_ERROR_BASELINE" ]; then
            echo "::error::ESLint error 數 ${ERRORS} 超過基準線 ${LINT_ERROR_BASELINE}，請修正本次新增的問題。"
            npx eslint .
            exit 1
          fi
          if [ "$ERRORS" -lt "$LINT_ERROR_BASELINE" ]; then
            echo "::notice::ESLint error 已降到 ${ERRORS}，請同步調降 LINT_ERROR_BASELINE 以鎖住成果。"
          fi

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web-dashboard/dist

  # Playwright E2E 測試
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: web-dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # E2E 暫時維持 non-blocking：
      # 目前的 Playwright spec 需要一個真實可用的後端（登入、API 資料），CI 內沒有起
      # backend + Postgres，因此結果不具決定性，改成阻擋式會產生大量偽陽性紅燈。
      # TODO(Phase F): 在 e2e job 加上 postgres service + 啟動 backend（或改用 API mock），
      #                確認穩定後移除 continue-on-error。
      - name: Run E2E tests
        run: npx playwright test --reporter=list
        continue-on-error: true

  # Backend 建置與測試
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # 同 frontend：E.6 已將 critical 清零，critical 級設為阻擋；
      # high 級殘餘（需 breaking 升版）見 docs/security/DEPENDENCY_AUDIT_2026-07-31.md。
      - name: Security audit (blocking, critical)
        run: npm audit --audit-level=critical

      - name: Run tests
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build
